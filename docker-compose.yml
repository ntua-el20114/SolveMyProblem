version: '2.28.1'
services:
  db:
      image: mysql:8.4
      ports:
        - "3306:3306"
      networks:
      - app_network

    zoo1:
      image: wurstmeister/zookeeper:latest
      hostname: zoo1
      container_name: zoo1
      environment:
        ZOOKEEPER_CLIENT_PORT: 2181
        ZOOKEEPER_TICK_TIME: 2000
      ports:
        - "2181:2181"
      networks:
      - kafka_network

    kafka1:
      image: wurstmeister/kafka:latest
      hostname: kafka1
      container_name: kafka1
      depends_on:
        - zoo1
      ports:
        - "9092:9092"
        - "29092:29092"
      environment:
        KAFKA_BROKER_ID: 1
        KAFKA_ZOOKEEPER_CONNECT: zoo1:2181
        KAFKA_LISTENERS: INTERNAL://kafka1:9092,EXTERNAL://localhost:9092
        KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka1:29092,EXTERNAL://localhost:9092
        KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
        KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
        KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      networks:
      - kafka_network

  ms_analytics:
    build: ./ms_analytics
    ports:
      - "3006:3006"
    env_file:
      - ./ms_analytics/.env
    depends_on:
      - db
      - kafka1
    networks:
      - app_network
      - kafka_network

  ms_choreographer:
    build: ./ms_choreographer
    ports:
      - "3001:3001"
    env_file:
      - ./ms_choreographer/.env  
    depends_on:
      - kafka1
    networks:
      - app_network
      - kafka_network

  ms_data_input:
    build: ./ms_data_input
    ports:
      - "3002:3009"
    env_file:
      - ./ms_data_input/.env
    depends_on:
      - kafka1
    networks:
      - app_network
      - kafka_network

  ms_results:
    build: ./ms_results
    ports:
      - "3005:3005"
    env_file:
      - ./ms_results/.env
    depends_on:
      - db
      - kafka1
    networks:
      - app_network
      - kafka_network

  ms_problem_list:
    build: ./ms_problem_list
    ports:
      - "3003:3003"
    env_file:
      - ./ms_problem_list/.env
    depends_on:
      - db
      - kafka1
    networks:
      - app_network
      - kafka_network
  
  ms_solver:
    build: ./ms_solver
    ports:
      - "3004:3004"
    env_file:
      - ./ms_solver/.env
    depends_on:
      - kafka1
    networks:
      - app_network
      - kafka_network

  ms_frontend:
    build: ./ms_frontend
    ports:
      - "3000:3000"
    env_file:
      - ./ms_frontend/.env
    depends_on:
    - kafka1
    networks:
      - app_network
  
  networks:
    app_network:
      driver: bridge
    kafka_network:
      driver: bridge